<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Você decide o futuro da IA</title>
</head>
<body>
    <main class="caixa-principal">
        <h1>Você decide o futuro da IA</h1>
        <p class="indicador-progresso" aria-live="polite"></p>
        <div class="caixa-perguntas" aria-live="polite" tabindex="-1"></div>
        <div class="caixa-alternativas"></div>
        <div class="controles-quiz">
            <button class="botao-voltar" type="button" hidden>Voltar uma pergunta</button>
            <p class="estado-quiz" aria-live="polite"></p>
        </div>
        <div class="caixa-resultado">
            <p class="texto-resultado" aria-live="polite"></p>
            <button class="botao-reiniciar" type="button" hidden>Jogar novamente</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
